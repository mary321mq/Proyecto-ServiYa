name: ms-notification-dev

version: "3.9"

services:
  mysql-notification-dev:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_notification
    ports:
      - "3318:3306"
    volumes:
      - mysql_notification_dev_data:/var/lib/mysql

volumes:
  mysql_notification_dev_data:
