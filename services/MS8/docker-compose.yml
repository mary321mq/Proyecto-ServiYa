name: ms-notification-prod

version: "3.9"

services:
  mysql-notification:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NOTIFICATION_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${NOTIFICATION_MYSQL_DATABASE}
    ports:
      - "3318:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -p${NOTIFICATION_MYSQL_ROOT_PASSWORD} || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_notification_data:/var/lib/mysql
    networks:
      - notification-int

  ms-notification:
    build: .
    restart: unless-stopped
    depends_on:
      mysql-notification:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      NOTIFICATION_DB_HOST: ${NOTIFICATION_DB_HOST}
      NOTIFICATION_DB_PORT: ${NOTIFICATION_DB_PORT}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME}
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "8088:8088"
    networks:
      - notification-int
      - ms-net

volumes:
  mysql_notification_data:

networks:
  ms-net:
    external: true
    name: ms-net
  notification-int:
    name: notification-int
