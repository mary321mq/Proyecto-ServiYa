name: ms-technician-dev

version: "3.9"

services:
  mysql-technician-dev:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_technician
    ports:
      - "3313:3306" # Tu máquina (cliente externo) → MySQL dev
    volumes:
      - mysql_technician_dev_data:/var/lib/mysql

volumes:
  mysql_technician_dev_data:
