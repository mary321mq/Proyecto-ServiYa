name: ms-review-dev

version: "3.9"

services:
  mysql-review-dev:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_review
    ports:
      - "3317:3306"
    volumes:
      - mysql_review_dev_data:/var/lib/mysql

volumes:
  mysql_review_dev_data:
