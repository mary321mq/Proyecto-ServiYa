name: ms-review-prod

version: "3.9"

services:
  mysql-review:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${REVIEW_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${REVIEW_MYSQL_DATABASE}
    ports:
      - "3317:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -p${REVIEW_MYSQL_ROOT_PASSWORD} || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_review_data:/var/lib/mysql
    networks:
      - review-int

  ms-review:
    build: .
    restart: unless-stopped
    depends_on:
      mysql-review:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL}
      REVIEW_DB_HOST: ${REVIEW_DB_HOST}
      REVIEW_DB_PORT: ${REVIEW_DB_PORT}
      REVIEW_DB_NAME: ${REVIEW_DB_NAME}
      REVIEW_DB_USERNAME: ${REVIEW_DB_USERNAME}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD}
    ports:
      - "8087:8087"
    networks:
      - review-int
      - ms-net

volumes:
  mysql_review_data:

networks:
  ms-net:
    external: true
    name: ms-net
  review-int:
    name: review-int
