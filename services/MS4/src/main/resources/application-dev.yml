server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://${SERVICEREQUEST_DB_HOST:localhost}:${SERVICEREQUEST_DB_PORT:3314}/${SERVICEREQUEST_DB_NAME:db_service_request}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${SERVICEREQUEST_DB_USERNAME:root}
    password: ${SERVICEREQUEST_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:dev-secret-please-change-dev-secret-please-change}
